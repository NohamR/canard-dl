[project]
name = "canard-dl"
version = "0.1.0"
description = "Download articles from Le Canard Enchaîné"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[project.scripts]
canard-dl = "canard_dl.cli:main"

[dependency-groups]
dev = [
    "pylint>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canard_dl"]